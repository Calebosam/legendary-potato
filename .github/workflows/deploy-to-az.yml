name: Build and Deploy Docker Image

on:
  push:
    branches:
      - feat/deploy-to-az-vm

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/legendary-potato:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/legendary-potato:latest

  deploy:
    name: Deploy on VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy Image to VM
      run: |
        ssh -i ${{ secrets.VM_SSH_KEY }} -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
          docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p "${{ secrets.ACR_PASSWORD }}"
          docker pull ${{ secrets.ACR_LOGIN_SERVER }}/legendary-potato:latest
          docker stop legendary-potato || true
          docker rm legendary-potato || true
          docker run -d --name legendary-potato -p 8080:80 ${{ secrets.ACR_LOGIN_SERVER }}/legendary-potato:latest
        EOF
